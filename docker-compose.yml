services:
  redis:
    image: redis:alpine
    container_name: redis-db
    volumes:
      - redis_data:/data

  app: 
    build: .
    container_name: app
    ports:
      - 3000:3000
    depends_on: 
      - redis
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules

  queue: 
    build: 
      context: .
      dockerfile: Dockerfile.worker
    container_name: worker
    depends_on: 
      - redis
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules

volumes:
  redis_data: