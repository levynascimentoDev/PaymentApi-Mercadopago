services:
  redis:
    image: redis:alpine
    container_name: redis-db
    volumes:
      - redis_data:/data

  app: 
    build: .
    container_name: app
    ports:
      - 3000:3000
    depends_on: 
      - redis
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules

  queue: 
    build: .
    container_name: worker
    depends_on: 
      - redis
      - app
    env_file: .env
    volumes:
      - ./:/app
      - /app/node_modules
    command: ["bun", "run", "queue:work"]
        

volumes:
  redis_data: